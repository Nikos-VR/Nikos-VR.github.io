<html>

<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>Jigsaw Puzzle</title>
 <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>

<body>
 <a-scene>
  <a-sky color="#0f172a"></a-sky>
  <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20" color="#1e293b" roughness="0.8"></a-plane>
  <a-entity id="table" position="0 0 -1.2">
   <a-box width="1.8" height="0.08" depth="1.2" position="0 0.76 0" color="#5c3a21" roughness="0.5"></a-box>
   <a-cylinder radius="0.04" height="0.75" position="-0.8 0.375 -0.5" color="#3b2312"></a-cylinder>
   <a-cylinder radius="0.04" height="0.75" position="0.8 0.375 -0.5" color="#3b2312"></a-cylinder>
   <a-cylinder radius="0.04" height="0.75" position="-0.8 0.375 0.5" color="#3b2312"></a-cylinder>
   <a-cylinder radius="0.04" height="0.75" position="0.8 0.375 0.5" color="#3b2312"></a-cylinder>
   <a-entity id="puzzle-board" position="0 0.801 0" rotation="-90 0 0"></a-entity>
  </a-entity>
  <a-entity id="pieces-container"></a-entity>
  <a-entity id="vr-hud" position="0 1.6 -1.8">
   <a-text id="vr-hud-text" value="" align="center" color="#4ade80" width="2.8"></a-text>
  </a-entity>
  <a-entity id="rig" position="0 0 0">
   <a-camera id="camera" position="0 1.55 0" look-controls="pointerLockEnabled: false; touchEnabled: false">
    <a-entity id="mouse-cursor" cursor="rayOrigin: mouse" raycaster="objects: .pickable; far: 10"></a-entity>
   </a-camera>
   <a-entity id="left-hand" laser-controls="hand: left" raycaster="objects: .pickable; far: 5"></a-entity>
   <a-entity id="right-hand" laser-controls="hand: right" raycaster="objects: .pickable; far: 5"></a-entity>
  </a-entity>
 </a-scene>
 <script>
  window.state = {
   gridSize: 5,
   totalPieces: 25,
   heldPieceId: null,
   activeVRHand: null,
   pieces: [],
   isCompleted: false
  };

  let dragStartPoint = null;

  // Όρια Επιφάνειας Τραπεζιού
  const TABLE_MIN_X = -0.85;
  const TABLE_MAX_X = 0.85;
  const TABLE_MIN_Z = -1.75;
  const TABLE_MAX_Z = -0.65;

  function loadPuzzleImage() {
   const img = new Image();
   img.crossOrigin = 'anonymous';

   img.onload = () => {
    initPuzzle(img);
   };

   img.onerror = () => {
    // Δημιουργία αναπληρωματικής εικόνας αν δεν βρεθεί το puzzle.jpg
    const fallbackCanvas = document.createElement('canvas');
    fallbackCanvas.width = 800;
    fallbackCanvas.height = 800;
    const ctx = fallbackCanvas.getContext('2d');

    const grad = ctx.createLinearGradient(0, 0, 800, 800);
    grad.addColorStop(0, '#0284c7');
    grad.addColorStop(0.5, '#6366f1');
    grad.addColorStop(1, '#ec4899');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 800, 800);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 70px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('VR JIGSAW', 400, 380);
    ctx.font = '35px sans-serif';
    ctx.fillText('A-Frame 1.6.0', 400, 450);

    initPuzzle(fallbackCanvas);
   };

   img.src = 'puzzle.jpg';
  }

  // ==================== PROCEDURAL CANVAS JIGSAW SLICER ==================== //
  function drawJigsawEdge(ctx, x1, y1, x2, y2, tabDir) {
   if (tabDir === 0) {
    ctx.lineTo(x2, y2);
    return;
   }
   const dx = x2 - x1;
   const dy = y2 - y1;
   const dist = Math.hypot(dx, dy);
   const nx = -dy / dist * tabDir;
   const ny = dx / dist * tabDir;

   const p1x = x1 + dx * 0.35;
   const p1y = y1 + dy * 0.35;
   const p2x = x1 + dx * 0.65;
   const p2y = y1 + dy * 0.65;

   ctx.lineTo(p1x, p1y);

   const tabSize = dist * 0.22;
   const mx = x1 + dx * 0.5;
   const my = y1 + dy * 0.5;

   const tipX = mx + nx * tabSize;
   const tipY = my + ny * tabSize;

   const c1x = p1x + nx * (tabSize * 0.2);
   const c1y = p1y + ny * (tabSize * 0.2);
   const c2x = tipX - (dx / dist) * (tabSize * 0.6);
   const c2y = tipY - (dy / dist) * (tabSize * 0.6);

   ctx.bezierCurveTo(c1x, c1y, c2x, c2y, tipX, tipY);

   const c3x = tipX + (dx / dist) * (tabSize * 0.6);
   const c3y = tipY + (dy / dist) * (tabSize * 0.6);
   const c4x = p2x + nx * (tabSize * 0.2);
   const c4y = p2y + ny * (tabSize * 0.2);

   ctx.bezierCurveTo(c3x, c3y, c4x, c4y, p2x, p2y);

   ctx.lineTo(x2, y2);
  }

  function sliceCanvasToJigsaw(sourceCanvas, N) {
   const W = sourceCanvas.width;
   const H = sourceCanvas.height;
   const cellW = W / N;
   const cellH = H / N;

   const vEdges = Array.from({length: N}, () => Array(N - 1).fill(0));
   const hEdges = Array.from({length: N - 1}, () => Array(N).fill(0));

   for (let r = 0; r < N; r++) {
    for (let c = 0; c < N - 1; c++) {
     vEdges[r][c] = Math.random() < 0.5 ? 1 : -1;
    }
   }
   for (let r = 0; r < N - 1; r++) {
    for (let c = 0; c < N; c++) {
     hEdges[r][c] = Math.random() < 0.5 ? 1 : -1;
    }
   }

   const slices = [];
   const margin = cellW * 0.28;

   for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
     const pieceCanvas = document.createElement('canvas');
     pieceCanvas.width = cellW + margin * 2;
     pieceCanvas.height = cellH + margin * 2;
     const ctx = pieceCanvas.getContext('2d');

     ctx.translate(margin, margin);

     ctx.beginPath();
     ctx.moveTo(0, 0);

     // Top
     const topTab = r === 0 ? 0 : -hEdges[r - 1][c];
     drawJigsawEdge(ctx, 0, 0, cellW, 0, topTab);

     // Right
     const rightTab = c === N - 1 ? 0 : vEdges[r][c];
     drawJigsawEdge(ctx, cellW, 0, cellW, cellH, rightTab);

     // Bottom
     const bottomTab = r === N - 1 ? 0 : hEdges[r][c];
     drawJigsawEdge(ctx, cellW, cellH, 0, cellH, bottomTab);

     // Left
     const leftTab = c === 0 ? 0 : -vEdges[r][c - 1];
     drawJigsawEdge(ctx, 0, cellH, 0, 0, leftTab);

     ctx.closePath();
     ctx.clip();

     // Draw slice
     const sx = c * cellW - margin;
     const sy = r * cellH - margin;
     const sw = cellW + margin * 2;
     const sh = cellH + margin * 2;

     ctx.drawImage(sourceCanvas, sx, sy, sw, sh, -margin, -margin, sw, sh);

     // Edge stroke outline
     ctx.strokeStyle = 'rgba(0,0,0,0.6)';
     ctx.lineWidth = 4;
     ctx.stroke();

     slices.push({
      row: r,
      col: c,
      canvas: pieceCanvas
     });
    }
   }

   // Board canvas with grid outline
   const boardCanvas = document.createElement('canvas');
   boardCanvas.width = W;
   boardCanvas.height = H;
   const bctx = boardCanvas.getContext('2d');
   bctx.globalAlpha = 0.25;
   bctx.drawImage(sourceCanvas, 0, 0, W, H);
   bctx.globalAlpha = 1.0;
   bctx.strokeStyle = 'rgba(255,255,255,0.7)';
   return {slices, boardCanvas};
  }

  // ==================== UNIVERSAL THREE.JS RAYCASTING DRAG SYSTEM ==================== //
  function pickPiece(pieceId, handEl = null) {
   const piece = window.state.pieces[pieceId];
   if (!piece) return;

   window.state.heldPieceId = pieceId;
   window.state.activeVRHand = handEl;
   dragStartPoint = null;

   const camera = document.getElementById('camera');
   if (camera && !handEl) {
    camera.setAttribute('look-controls', 'enabled: false');
   }

   piece.group.forEach(p => {
    if (p.locked) {
     p.locked = false;
    }
    p.dragStartPos = { x: p.currentPos.x, z: p.currentPos.z };
    p.currentPos.y = 0.88;
    const el = document.getElementById(`piece-${p.id}`);
    if (el) {
     el.setAttribute('position', `${p.currentPos.x} 0.88 ${p.currentPos.z}`);
    }
   });

   updateUI();
  }

  function releasePiece(pieceId) {
   const piece = window.state.pieces[pieceId];
   if (!piece) return;

   window.state.heldPieceId = null;
   window.state.activeVRHand = null;
   dragStartPoint = null;

   const camera = document.getElementById('camera');
   if (camera) {
    camera.setAttribute('look-controls', 'enabled: true; pointerLockEnabled: false; touchEnabled: false');
   }

   checkSnap(pieceId);
  }

  function checkSnap(pieceId) {
   const piece = window.state.pieces[pieceId];
   if (!piece) return;

   let group = piece.group;

   // 1. Check if group snaps to BOARD target positions
   let snapToBoard = false;
   for (const p of group) {
    const dist = Math.hypot(p.currentPos.x - p.targetPos.x, p.currentPos.z - p.targetPos.z);
    if (dist < 0.15) {
     snapToBoard = true;
     break;
    }
   }

   if (snapToBoard) {
    lockGroup(group);
    return;
   }

   // 2. Check NEIGHBOR snapping on table surface
   const SNAP_THRESHOLD = 0.08;
   let merged = false;

   for (const p1 of [...group]) {
    for (const p2 of window.state.pieces) {
     if (group.includes(p2)) continue;

     const isNeighbor = (Math.abs(p1.row - p2.row) + Math.abs(p1.col - p2.col)) === 1;
     if (isNeighbor) {
      const expectedX = p2.currentPos.x + (p1.targetPos.x - p2.targetPos.x);
      const expectedZ = p2.currentPos.z + (p1.targetPos.z - p2.targetPos.z);
      const dist = Math.hypot(p1.currentPos.x - expectedX, p1.currentPos.z - expectedZ);

      if (dist < SNAP_THRESHOLD) {
       const shiftX = expectedX - p1.currentPos.x;
       const shiftZ = expectedZ - p1.currentPos.z;

       group.forEach(gp => {
        gp.currentPos.x += shiftX;
        gp.currentPos.z += shiftZ;
        const el = document.getElementById(`piece-${gp.id}`);
        if (el) {
         el.setAttribute('position', `${gp.currentPos.x} ${gp.currentPos.y} ${gp.currentPos.z}`);
        }
       });

       const mergedGroup = [...group, ...p2.group];
       mergedGroup.forEach(gp => gp.group = mergedGroup);
       group = mergedGroup;
       merged = true;
       break;
      }
     }
    }
    if (merged) break;
   }

   // 3. If merged with neighbor, re-check if board snap is triggered
   if (merged) {
    for (const p of group) {
     const dist = Math.hypot(p.currentPos.x - p.targetPos.x, p.currentPos.z - p.targetPos.z);
     if (dist < 0.15) {
      lockGroup(group);
      return;
     }
    }
   }

   // 4. Set un-locked group pieces back to table Y (0.802)
   group.forEach(p => {
    if (!p.locked) {
     p.currentPos.y = 0.802;
     const el = document.getElementById(`piece-${p.id}`);
     if (el) {
      el.setAttribute('position', `${p.currentPos.x} 0.802 ${p.currentPos.z}`);
     }
    }
   });

   updateUI();
  }

  function lockGroup(group) {
   group.forEach(p => {
    p.locked = true;
    p.currentPos.x = p.targetPos.x;
    p.currentPos.y = p.targetPos.y;
    p.currentPos.z = p.targetPos.z;

    const el = document.getElementById(`piece-${p.id}`);
    if (el) {
     el.setAttribute('position', `${p.targetPos.x} ${p.targetPos.y} ${p.targetPos.z}`);
    }
   });

   updateUI();
  }

  // Move held piece group across table surface with BORDER CLAMPING
  function updateDragPosition(clientX, clientY) {
   if (window.state.heldPieceId === null || window.state.activeVRHand) return;

   const cameraEl = document.getElementById('camera');
   if (!cameraEl) return;
   const threeCamera = cameraEl.getObject3D('camera');
   if (!threeCamera) return;

   const mouse = new THREE.Vector2(
    (clientX / window.innerWidth) * 2 - 1,
    -(clientY / window.innerHeight) * 2 + 1
   );

   const raycaster = new THREE.Raycaster();
   raycaster.setFromCamera(mouse, threeCamera);

   const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.88);
   const targetPoint = new THREE.Vector3();

   if (raycaster.ray.intersectPlane(plane, targetPoint)) {
    if (!dragStartPoint) {
     dragStartPoint = { x: targetPoint.x, z: targetPoint.z };
    }

    const rawDeltaX = targetPoint.x - dragStartPoint.x;
    const rawDeltaZ = targetPoint.z - dragStartPoint.z;

    const heldPiece = window.state.pieces[window.state.heldPieceId];

    let minAllowedDeltaX = -Infinity, maxAllowedDeltaX = Infinity;
    let minAllowedDeltaZ = -Infinity, maxAllowedDeltaZ = Infinity;

    heldPiece.group.forEach(p => {
     minAllowedDeltaX = Math.max(minAllowedDeltaX, TABLE_MIN_X - p.dragStartPos.x);
     maxAllowedDeltaX = Math.min(maxAllowedDeltaX, TABLE_MAX_X - p.dragStartPos.x);
     minAllowedDeltaZ = Math.max(minAllowedDeltaZ, TABLE_MIN_Z - p.dragStartPos.z);
     maxAllowedDeltaZ = Math.min(maxAllowedDeltaZ, TABLE_MAX_Z - p.dragStartPos.z);
    });

    const deltaX = Math.max(minAllowedDeltaX, Math.min(maxAllowedDeltaX, rawDeltaX));
    const deltaZ = Math.max(minAllowedDeltaZ, Math.min(maxAllowedDeltaZ, rawDeltaZ));

    heldPiece.group.forEach(p => {
     p.currentPos.x = p.dragStartPos.x + deltaX;
     p.currentPos.z = p.dragStartPos.z + deltaZ;
     p.currentPos.y = 0.88;

     const el = document.getElementById(`piece-${p.id}`);
     if (el) {
      el.setAttribute('position', `${p.currentPos.x} 0.88 ${p.currentPos.z}`);
     }
    });
   }
  }

  window.addEventListener('mousemove', (e) => {
   updateDragPosition(e.clientX, e.clientY);
  });

  window.addEventListener('touchmove', (e) => {
   if (e.touches && e.touches[0]) {
    updateDragPosition(e.touches[0].clientX, e.touches[0].clientY);
   }
  });

  window.addEventListener('mouseup', () => {
   if (window.state.heldPieceId !== null && !window.state.activeVRHand) {
    releasePiece(window.state.heldPieceId);
   }
  });

  window.addEventListener('touchend', () => {
   if (window.state.heldPieceId !== null && !window.state.activeVRHand) {
    releasePiece(window.state.heldPieceId);
   }
  });

  // ==================== GAME SETUP & THREE.MESH BUILDING ==================== //
  function initPuzzle(loadedSource) {
   window.state.totalPieces = window.state.gridSize * window.state.gridSize;
   window.state.heldPieceId = null;
   window.state.activeVRHand = null;
   window.state.isCompleted = false;

   const artCanvas = document.createElement('canvas');
   artCanvas.width = 800;
   artCanvas.height = 800;
   const ctx = artCanvas.getContext('2d');
   ctx.drawImage(loadedSource, 0, 0, 800, 800);

   const {slices, boardCanvas} = sliceCanvasToJigsaw(artCanvas, window.state.gridSize);

   const boardEntity = document.getElementById('puzzle-board');
   const boardGeom = new THREE.PlaneGeometry(0.8, 0.8);
   const boardTexture = new THREE.CanvasTexture(boardCanvas);
   if (THREE.SRGBColorSpace) boardTexture.colorSpace = THREE.SRGBColorSpace;
   const boardMat = new THREE.MeshBasicMaterial({
    map: boardTexture,
    transparent: true,
    opacity: 0.65,
    side: THREE.DoubleSide
   });
   const boardMesh = new THREE.Mesh(boardGeom, boardMat);
   boardEntity.setObject3D('mesh', boardMesh);

   const container = document.getElementById('pieces-container');
   container.innerHTML = '';
   window.state.pieces = [];

   const boardSize = 0.8;
   const pieceSize = boardSize / window.state.gridSize;
   const pieceMeshDim = pieceSize * 1.56;

   slices.forEach((slice, idx) => {
    const targetX = -boardSize / 2 + (slice.col + 0.5) * pieceSize;
    const targetZ = -1.2 - boardSize / 2 + (slice.row + 0.5) * pieceSize;
    const targetY = 0.802;

    let randomX = TABLE_MIN_X + 0.1 + Math.random() * (TABLE_MAX_X - TABLE_MIN_X - 0.2);
    let randomZ = TABLE_MIN_Z + 0.1 + Math.random() * (TABLE_MAX_Z - TABLE_MIN_Z - 0.2);

    if (Math.abs(randomX) < 0.45 && Math.abs(randomZ + 1.2) < 0.45) {
     randomX += (randomX >= 0 ? 0.4 : -0.4);
    }

    const pieceData = {
     id: idx,
     row: slice.row,
     col: slice.col,
     targetPos: {x: targetX, y: targetY, z: targetZ},
     currentPos: {x: randomX, y: 0.802, z: randomZ},
     locked: false,
     group: []
    };
    pieceData.group = [pieceData];

    window.state.pieces.push(pieceData);

    const pieceEntity = document.createElement('a-entity');
    pieceEntity.setAttribute('id', `piece-${idx}`);
    pieceEntity.setAttribute('class', 'pickable');
    pieceEntity.setAttribute('position', `${pieceData.currentPos.x} ${pieceData.currentPos.y} ${pieceData.currentPos.z}`);
    pieceEntity.setAttribute('rotation', '-90 0 0');

    const pieceGeom = new THREE.PlaneGeometry(pieceMeshDim, pieceMeshDim);
    const pieceTexture = new THREE.CanvasTexture(slice.canvas);
    if (THREE.SRGBColorSpace) pieceTexture.colorSpace = THREE.SRGBColorSpace;
    const pieceMat = new THREE.MeshBasicMaterial({
     map: pieceTexture,
     transparent: true,
     side: THREE.DoubleSide
    });
    const pieceMesh = new THREE.Mesh(pieceGeom, pieceMat);
    pieceEntity.setObject3D('mesh', pieceMesh);

    pieceEntity.addEventListener('mousedown', (e) => {
     if (e.target.closest && e.target.closest('#ui-overlay')) return;
     pickPiece(idx);
    });

    pieceEntity.addEventListener('click', (e) => {
     if (window.state.heldPieceId === null) {
      pickPiece(idx);
     } else if (window.state.heldPieceId === idx) {
      releasePiece(idx);
     }
    });

    container.appendChild(pieceEntity);
   });

   updateUI();
  }

  function getLargestGroupSize() {
   if (!window.state.pieces || window.state.pieces.length === 0) return 0;
   let max = 0;
   window.state.pieces.forEach(p => {
    if (p.group && p.group.length > max) {
     max = p.group.length;
    }
   });
   return max;
  }

  function updateUI() {
   const largestGroup = getLargestGroupSize();
   
   if (largestGroup >= window.state.totalPieces && window.state.totalPieces > 0) {
    window.state.isCompleted = true;
   } else {
    window.state.isCompleted = false;
   }

   const vrHud = document.getElementById('vr-hud-text');
   if (vrHud) {
    if (window.state.isCompleted) {
     vrHud.setAttribute('value', 'Completed!');
     vrHud.setAttribute('color', '#4ade80');
    } else {
     vrHud.setAttribute('value', '');
    }
   }
  }

  // Εκκίνηση αμέσως
  window.addEventListener('load', () => {
   loadPuzzleImage();

   ['left-hand', 'right-hand'].forEach(handId => {
    const handEl = document.getElementById(handId);
    if (handEl) {
     handEl.addEventListener('selectstart', () => {
      const rc = handEl.components.raycaster;
      if (rc && rc.intersections && rc.intersections.length > 0) {
       const hit = rc.intersections[0].object.el;
       if (hit && hit.classList.contains('pickable')) {
        const id = parseInt(hit.id.replace('piece-', ''), 10);
        if (!isNaN(id)) pickPiece(id, handEl);
       }
      }
     });

     handEl.addEventListener('selectend', () => {
      if (window.state.heldPieceId !== null && window.state.activeVRHand === handEl) {
       releasePiece(window.state.heldPieceId);
      }
     });
    }
   });
  });
 </script>
</body>

</html>
