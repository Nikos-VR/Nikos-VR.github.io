<!DOCTYPE html>
<html lang="el">

<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>VR Jigsaw Puzzle</title>
 <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>

<body>
 <a-scene>
  <a-sky color="#0f172a"></a-sky>
  <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20" color="#1e293b" roughness="0.8"></a-plane>

  <!-- Τραπέζι -->
  <a-entity id="table" position="0 0 -0.83">
   <a-box width="1.92" height="0.08" depth="0.83" position="0 0.76 0" color="#5c3a21" roughness="0.5"></a-box>
   <a-cylinder radius="0.04" height="0.75" position="-0.8 0.375 -0.3" color="#3b2312"></a-cylinder>
   <a-cylinder radius="0.04" height="0.75" position="0.8 0.375 -0.3" color="#3b2312"></a-cylinder>
   <a-cylinder radius="0.04" height="0.75" position="-0.8 0.375 0.3" color="#3b2312"></a-cylinder>
   <a-cylinder radius="0.04" height="0.75" position="0.8 0.375 0.3" color="#3b2312"></a-cylinder>
   <!-- Λευκό Χαρτί (Σταθερές Διαστάσεις: 0.84m x 0.59m) -->
   <a-box width="0.84" height="0.01" depth="0.59" position="0 0.797 0" color="#ffffff" roughness="0.5"></a-box>
  </a-entity>

  <!-- Κομμάτια Παζλ -->
  <a-entity id="pieces-container"></a-entity>

  <!-- HUD: Εικόνα Αναφοράς & Μήνυμα Ολοκλήρωσης -->
  <a-entity id="vr-hud" position="0 1.65 -1.8">
   <a-entity id="reference-preview" position="0 0 0.5"></a-entity>
   <a-text id="vr-hud-text" value="" align="center" color="#4ade80" width="3" position="0 0.38 0"></a-text>
  </a-entity>

  <!-- Camera Rig, VR Controllers & Hand Tracking -->
  <a-entity id="rig" position="0 0 0">
   <a-camera id="camera" position="0 1.55 0" look-controls="pointerLockEnabled: false; touchEnabled: false">
    <a-entity id="mouse-cursor" cursor="rayOrigin: mouse" raycaster="objects: .pickable; far: 10"></a-entity>
   </a-camera>

   <a-entity id="left-hand" laser-controls="hand: left" hand-tracking-controls="hand: left"
    raycaster="objects: .pickable; far: 5">
   </a-entity>
   <a-entity id="right-hand" laser-controls="hand: right" hand-tracking-controls="hand: right"
    raycaster="objects: .pickable; far: 5">
   </a-entity>
  </a-entity>
 </a-scene>

 <script>
  window.state = {
   gridRows: 10,
   gridCols: 12,
   totalPieces: 120,
   heldPieceId: null,
   activeVRHand: null,
   leftPinching: false,
   rightPinching: false,
   puzzleW: 0.64,
   puzzleH: 0.46,
   pieces: [],
   isCompleted: false
  };

  let dragStartPoint = null;
  let initialHandAngleZ = 0;
  let lastTwoHandAngle = null;

  // Σταθερές Διαστάσεις Λευκού Χαρτιού & Όρια Τραπεζιού
  const PAPER_WIDTH = 0.84;
  const PAPER_DEPTH = 0.59;
  const TABLE_MIN_X = -0.84;
  const TABLE_MAX_X = 0.84;
  const TABLE_MIN_Z = -1.15;
  const TABLE_MAX_Z = -0.5;
  const RESTING_Y_BASE = 0.805;
  const DRAGGING_Y = 0.88;

  function loadPuzzleImage() {
   fetch('puzzle.jpg')
    .then(res => {
     if (!res.ok) throw new Error('HTTP ' + res.status);
     return res.blob();
    })
    .then(blob => {
     const reader = new FileReader();
     reader.onload = () => {
      const img = new Image();
      img.onload = () => initPuzzle(img);
      img.src = reader.result;
     };
     reader.readAsDataURL(blob);
    })
    .catch(() => {
     const img = new Image();
     img.crossOrigin = 'anonymous';
     img.onload = () => {
      const testCanvas = document.createElement('canvas');
      testCanvas.width = 10; testCanvas.height = 10;
      const tCtx = testCanvas.getContext('2d');
      tCtx.drawImage(img, 0, 0);
      try {
       tCtx.getImageData(0, 0, 1, 1);
       initPuzzle(img);
      } catch (e) {
       createProceduralFallback();
      }
     };
     img.onerror = () => createProceduralFallback();
     img.src = 'puzzle.jpg';
    });
  }

  function createProceduralFallback() {
   const fallbackCanvas = document.createElement('canvas');
   fallbackCanvas.width = 640;
   fallbackCanvas.height = 460;
   const ctx = fallbackCanvas.getContext('2d');

   const grad = ctx.createLinearGradient(0, 0, 640, 460);
   grad.addColorStop(0, '#0284c7');
   grad.addColorStop(0.5, '#6366f1');
   grad.addColorStop(1, '#ec4899');
   ctx.fillStyle = grad;
   ctx.fillRect(0, 0, 640, 460);

   ctx.fillStyle = '#ffffff';
   ctx.font = 'bold 100px sans-serif';
   ctx.textAlign = 'center';
   ctx.fillText('A B C D E F', 320, 120);
   ctx.fillText('G H J K L M', 320, 220);
   ctx.fillText('N O P Q R S', 320, 320);
   ctx.fillText('T U V W X Y', 320, 420);

   initPuzzle(fallbackCanvas);
  }

  // ==================== PROCEDURAL CANVAS JIGSAW SLICER ==================== //
  function drawJigsawEdge(ctx, x1, y1, x2, y2, tabDir) {
   if (tabDir === 0) {
    ctx.lineTo(x2, y2);
    return;
   }
   const dx = x2 - x1;
   const dy = y2 - y1;
   const dist = Math.hypot(dx, dy);
   const nx = -dy / dist * tabDir;
   const ny = dx / dist * tabDir;

   const p1x = x1 + dx * 0.35;
   const p1y = y1 + dy * 0.35;
   const p2x = x1 + dx * 0.65;
   const p2y = y1 + dy * 0.65;

   ctx.lineTo(p1x, p1y);

   const tabSize = dist * 0.22;
   const mx = x1 + dx * 0.5;
   const my = y1 + dy * 0.5;

   const tipX = mx + nx * tabSize;
   const tipY = my + ny * tabSize;

   const c1x = p1x + nx * (tabSize * 0.2);
   const c1y = p1y + ny * (tabSize * 0.2);
   const c2x = tipX - (dx / dist) * (tabSize * 0.6);
   const c2y = tipY - (dy / dist) * (tabSize * 0.6);

   ctx.bezierCurveTo(c1x, c1y, c2x, c2y, tipX, tipY);

   const c3x = tipX + (dx / dist) * (tabSize * 0.6);
   const c4x = p2x + nx * (tabSize * 0.2);
   const c3y = tipY + (dy / dist) * (tabSize * 0.6);
   const c4y = p2y + ny * (tabSize * 0.2);

   ctx.bezierCurveTo(c3x, c3y, c4x, c4y, p2x, p2y);

   ctx.lineTo(x2, y2);
  }

  function sliceCanvasToJigsaw(sourceCanvas, rows, cols) {
   const W = sourceCanvas.width;
   const H = sourceCanvas.height;
   const cellW = W / cols;
   const cellH = H / rows;

   const vEdges = Array.from({length: rows}, () => Array(cols - 1).fill(0));
   const hEdges = Array.from({length: rows - 1}, () => Array(cols).fill(0));

   for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols - 1; c++) {
     vEdges[r][c] = Math.random() < 0.5 ? 1 : -1;
    }
   }
   for (let r = 0; r < rows - 1; r++) {
    for (let c = 0; c < cols; c++) {
     hEdges[r][c] = Math.random() < 0.5 ? 1 : -1;
    }
   }

   const slices = [];
   const marginX = cellW * 0.28;
   const marginY = cellH * 0.28;

   for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
     const pieceCanvas = document.createElement('canvas');
     pieceCanvas.width = cellW + marginX * 2;
     pieceCanvas.height = cellH + marginY * 2;
     const ctx = pieceCanvas.getContext('2d');

     ctx.translate(marginX, marginY);

     ctx.beginPath();
     ctx.moveTo(0, 0);

     const topTab = r === 0 ? 0 : -hEdges[r - 1][c];
     drawJigsawEdge(ctx, 0, 0, cellW, 0, topTab);

     const rightTab = c === cols - 1 ? 0 : vEdges[r][c];
     drawJigsawEdge(ctx, cellW, 0, cellW, cellH, rightTab);

     const bottomTab = r === rows - 1 ? 0 : hEdges[r][c];
     drawJigsawEdge(ctx, cellW, cellH, 0, cellH, bottomTab);

     const leftTab = c === 0 ? 0 : -vEdges[r][c - 1];
     drawJigsawEdge(ctx, 0, cellH, 0, 0, leftTab);

     ctx.closePath();
     ctx.clip();

     const sx = c * cellW - marginX;
     const sy = r * cellH - marginY;
     const sw = cellW + marginX * 2;
     const sh = cellH + marginY * 2;

     ctx.drawImage(sourceCanvas, sx, sy, sw, sh, -marginX, -marginY, sw, sh);

     ctx.strokeStyle = 'rgba(0,0,0,0.6)';
     ctx.lineWidth = 4;
     ctx.stroke();

     slices.push({
      row: r,
      col: c,
      canvas: pieceCanvas
     });
    }
   }

   return slices;
  }

  // ==================== UNIVERSAL DRAG & ROTATION SYSTEM ==================== //
  function pickPiece(pieceId, handEl = null) {
   const piece = window.state.pieces[pieceId];
   if (!piece) return;

   window.state.heldPieceId = pieceId;
   window.state.activeVRHand = handEl;
   dragStartPoint = null;

   if (handEl && handEl.object3D) {
    initialHandAngleZ = handEl.object3D.rotation.z;
   }

   const camera = document.getElementById('camera');
   if (camera && !handEl) {
    camera.setAttribute('look-controls', 'enabled: false');
   }

   piece.group.forEach(p => {
    p.dragStartPos = {x: p.currentPos.x, z: p.currentPos.z};
    p.currentPos.y = DRAGGING_Y;
    const el = document.getElementById(`piece-${p.id}`);
    if (el) {
     el.setAttribute('position', `${p.currentPos.x} ${DRAGGING_Y} ${p.currentPos.z}`);
     const mesh = el.getObject3D('mesh');
     if (mesh) mesh.renderOrder = 999;
    }
   });

   updateUI();
  }

  function releasePiece(pieceId) {
   const piece = window.state.pieces[pieceId];
   if (!piece) return;

   window.state.heldPieceId = null;
   window.state.activeVRHand = null;
   dragStartPoint = null;
   lastTwoHandAngle = null;

   const camera = document.getElementById('camera');
   if (camera) {
    camera.setAttribute('look-controls', 'enabled: true; pointerLockEnabled: false; touchEnabled: false');
   }

   checkSnap(pieceId);
  }

  function rotateHeldGroup(stepDegrees = 10) {
   if (window.state.heldPieceId === null) return;
   const pivotPiece = window.state.pieces[window.state.heldPieceId];
   if (!pivotPiece) return;

   const pivotX = pivotPiece.currentPos.x;
   const pivotZ = pivotPiece.currentPos.z;
   const rad = (stepDegrees * Math.PI) / 180;

   pivotPiece.group.forEach(p => {
    const relX = p.currentPos.x - pivotX;
    const relZ = p.currentPos.z - pivotZ;

    const newRelX = relX * Math.cos(rad) + relZ * Math.sin(rad);
    const newRelZ = -relX * Math.sin(rad) + relZ * Math.cos(rad);

    p.currentPos.x = pivotX + newRelX;
    p.currentPos.z = pivotZ + newRelZ;
    p.rotation = (p.rotation + stepDegrees + 360) % 360;
   });

   let clampShiftX = 0;
   let clampShiftZ = 0;
   pivotPiece.group.forEach(p => {
    if (p.currentPos.x < TABLE_MIN_X) clampShiftX = Math.max(clampShiftX, TABLE_MIN_X - p.currentPos.x);
    if (p.currentPos.x > TABLE_MAX_X) clampShiftX = Math.min(clampShiftX, TABLE_MAX_X - p.currentPos.x);
    if (p.currentPos.z < TABLE_MIN_Z) clampShiftZ = Math.max(clampShiftZ, TABLE_MIN_Z - p.currentPos.z);
    if (p.currentPos.z > TABLE_MAX_Z) clampShiftZ = Math.min(clampShiftZ, TABLE_MAX_Z - p.currentPos.z);
   });

   pivotPiece.group.forEach(p => {
    p.currentPos.x += clampShiftX;
    p.currentPos.z += clampShiftZ;
    p.dragStartPos = {x: p.currentPos.x, z: p.currentPos.z};

    const el = document.getElementById(`piece-${p.id}`);
    if (el) {
     el.setAttribute('position', `${p.currentPos.x} ${DRAGGING_Y} ${p.currentPos.z}`);
     el.setAttribute('rotation', `-90 ${p.rotation} 0`);
    }
   });

   dragStartPoint = null;
  }

  function checkHandGestures() {
   if (window.state.heldPieceId !== null) {
    const leftHand = document.getElementById('left-hand');
    const rightHand = document.getElementById('right-hand');

    if (window.state.leftPinching && window.state.rightPinching) {
     if (leftHand && rightHand && leftHand.object3D && rightHand.object3D) {
      const pL = new THREE.Vector3();
      const pR = new THREE.Vector3();
      leftHand.object3D.getWorldPosition(pL);
      rightHand.object3D.getWorldPosition(pR);

      const dx = pR.x - pL.x;
      const dz = pR.z - pL.z;
      const currentAngle = Math.atan2(dz, dx) * (180 / Math.PI);

      if (lastTwoHandAngle === null) {
       lastTwoHandAngle = currentAngle;
      } else {
       const delta = currentAngle - lastTwoHandAngle;
       if (delta > 10) {
        rotateHeldGroup(10);
        lastTwoHandAngle = currentAngle;
       } else if (delta < -10) {
        rotateHeldGroup(-10);
        lastTwoHandAngle = currentAngle;
       }
      }
     }
    } else {
     lastTwoHandAngle = null;

     const handEl = window.state.activeVRHand;
     if (handEl && handEl.object3D) {
      const currentAngleZ = handEl.object3D.rotation.z;
      const deltaAngle = (currentAngleZ - initialHandAngleZ) * (180 / Math.PI);

      if (deltaAngle > 10) {
       rotateHeldGroup(10);
       initialHandAngleZ = currentAngleZ;
      } else if (deltaAngle < -10) {
       rotateHeldGroup(-10);
       initialHandAngleZ = currentAngleZ;
      }
     }
    }
   } else {
    lastTwoHandAngle = null;
   }
   requestAnimationFrame(checkHandGestures);
  }
  requestAnimationFrame(checkHandGestures);

  function checkSnap(pieceId) {
   const piece = window.state.pieces[pieceId];
   if (!piece) return;

   let group = piece.group;
   const SNAP_THRESHOLD = 0.08;
   const unitW = window.state.puzzleW / window.state.gridCols;
   const unitH = window.state.puzzleH / window.state.gridRows;
   let merged = false;

   for (const p1 of [...group]) {
    for (const p2 of window.state.pieces) {
     if (group.includes(p2)) continue;

     if (p1.rotation !== p2.rotation) continue;

     const isNeighbor = (Math.abs(p1.row - p2.row) + Math.abs(p1.col - p2.col)) === 1;
     if (isNeighbor) {
      const dc = p1.col - p2.col;
      const dr = p1.row - p2.row;
      const unrotDx = dc * unitW;
      const unrotDz = dr * unitH;

      const rad = (p1.rotation * Math.PI) / 180;
      const rotDx = unrotDx * Math.cos(rad) + unrotDz * Math.sin(rad);
      const rotDz = -unrotDx * Math.sin(rad) + unrotDz * Math.cos(rad);

      const expectedX = p2.currentPos.x + rotDx;
      const expectedZ = p2.currentPos.z + rotDz;
      const dist = Math.hypot(p1.currentPos.x - expectedX, p1.currentPos.z - expectedZ);

      if (dist < SNAP_THRESHOLD) {
       const shiftX = expectedX - p1.currentPos.x;
       const shiftZ = expectedZ - p1.currentPos.z;

       group.forEach(gp => {
        gp.currentPos.x += shiftX;
        gp.currentPos.z += shiftZ;
        const el = document.getElementById(`piece-${gp.id}`);
        if (el) {
         el.setAttribute('position', `${gp.currentPos.x} ${gp.currentPos.y} ${gp.currentPos.z}`);
        }
       });

       const mergedGroup = [...group, ...p2.group];
       mergedGroup.forEach(gp => gp.group = mergedGroup);
       group = mergedGroup;
       merged = true;
       break;
      }
     }
    }
    if (merged) break;
   }

   group.forEach(p => {
    const restingY = RESTING_Y_BASE + (p.id * 0.0001);
    p.currentPos.y = restingY;
    const el = document.getElementById(`piece-${p.id}`);
    if (el) {
     el.setAttribute('position', `${p.currentPos.x} ${restingY} ${p.currentPos.z}`);
     const mesh = el.getObject3D('mesh');
     if (mesh) mesh.renderOrder = p.id;
    }
   });

   updateUI();
  }

  function updateDragPosition(clientX, clientY) {
   if (window.state.heldPieceId === null || window.state.activeVRHand) return;

   const cameraEl = document.getElementById('camera');
   if (!cameraEl) return;
   const threeCamera = cameraEl.getObject3D('camera');
   if (!threeCamera) return;

   const mouse = new THREE.Vector2(
    (clientX / window.innerWidth) * 2 - 1,
    -(clientY / window.innerHeight) * 2 + 1
   );

   const raycaster = new THREE.Raycaster();
   raycaster.setFromCamera(mouse, threeCamera);

   const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -DRAGGING_Y);
   const targetPoint = new THREE.Vector3();

   if (raycaster.ray.intersectPlane(plane, targetPoint)) {
    if (!dragStartPoint) {
     dragStartPoint = {x: targetPoint.x, z: targetPoint.z};
    }

    const rawDeltaX = targetPoint.x - dragStartPoint.x;
    const rawDeltaZ = targetPoint.z - dragStartPoint.z;

    const heldPiece = window.state.pieces[window.state.heldPieceId];

    let minAllowedDeltaX = -Infinity, maxAllowedDeltaX = Infinity;
    let minAllowedDeltaZ = -Infinity, maxAllowedDeltaZ = Infinity;

    heldPiece.group.forEach(p => {
     minAllowedDeltaX = Math.max(minAllowedDeltaX, TABLE_MIN_X - p.dragStartPos.x);
     maxAllowedDeltaX = Math.min(maxAllowedDeltaX, TABLE_MAX_X - p.dragStartPos.x);
     minAllowedDeltaZ = Math.max(minAllowedDeltaZ, TABLE_MIN_Z - p.dragStartPos.z);
     maxAllowedDeltaZ = Math.min(maxAllowedDeltaZ, TABLE_MAX_Z - p.dragStartPos.z);
    });

    const deltaX = Math.max(minAllowedDeltaX, Math.min(maxAllowedDeltaX, rawDeltaX));
    const deltaZ = Math.max(minAllowedDeltaZ, Math.min(maxAllowedDeltaZ, rawDeltaZ));

    heldPiece.group.forEach(p => {
     p.currentPos.x = p.dragStartPos.x + deltaX;
     p.currentPos.z = p.dragStartPos.z + deltaZ;
     p.currentPos.y = DRAGGING_Y;

     const el = document.getElementById(`piece-${p.id}`);
     if (el) {
      el.setAttribute('position', `${p.currentPos.x} ${DRAGGING_Y} ${p.currentPos.z}`);
     }
    });
   }
  }

  // Mouse & Touch Listeners
  window.addEventListener('mousemove', (e) => updateDragPosition(e.clientX, e.clientY));
  window.addEventListener('touchmove', (e) => {
   if (e.touches && e.touches[0]) updateDragPosition(e.touches[0].clientX, e.touches[0].clientY);
  });

  window.addEventListener('wheel', (e) => {
   if (window.state.heldPieceId !== null) {
    e.preventDefault();
    rotateHeldGroup(e.deltaY > 0 ? 10 : -10);
   }
  }, {passive: false});

  window.addEventListener('keydown', (e) => {
   if ((e.key === 'r' || e.key === 'R') && window.state.heldPieceId !== null) rotateHeldGroup(10);
   else if ((e.key === 't' || e.key === 'T') && window.state.heldPieceId !== null) rotateHeldGroup(-10);
  });

  window.addEventListener('contextmenu', (e) => {
   if (window.state.heldPieceId !== null) {
    e.preventDefault();
    rotateHeldGroup(10);
   }
  });

  window.addEventListener('mouseup', () => {
   if (window.state.heldPieceId !== null && !window.state.activeVRHand) releasePiece(window.state.heldPieceId);
  });
  window.addEventListener('touchend', () => {
   if (window.state.heldPieceId !== null && !window.state.activeVRHand) releasePiece(window.state.heldPieceId);
  });

  // ==================== GAME SETUP ==================== //
  function initPuzzle(loadedSource) {
   window.state.totalPieces = window.state.gridRows * window.state.gridCols;
   window.state.heldPieceId = null;
   window.state.activeVRHand = null;
   window.state.isCompleted = false;

   const imgW = loadedSource.width || loadedSource.naturalWidth || 640;
   const imgH = loadedSource.height || loadedSource.naturalHeight || 460;

   const artCanvas = document.createElement('canvas');
   artCanvas.width = imgW;
   artCanvas.height = imgH;
   const ctx = artCanvas.getContext('2d');
   ctx.drawImage(loadedSource, 0, 0, imgW, imgH);

   // 1. Μετατροπή pixels σε μέτρα (1px = 0.001m)
   let pW = imgW / 1000;
   let pH = imgH / 1000;

   // 2. Αν η εικόνα υπερβαίνει τις διαστάσεις του χαρτιού (0.84m x 0.59m), κλιμακώνεται αναλογικά
   const maxW = PAPER_WIDTH - 0.04; // 0.80m
   const maxH = PAPER_DEPTH - 0.04; // 0.55m

   if (pW > maxW || pH > maxH) {
    const scale = Math.min(maxW / pW, maxH / pH);
    pW *= scale;
    pH *= scale;
   }

   window.state.puzzleW = pW;
   window.state.puzzleH = pH;

   // Προεπισκόπηση HUD
   const aspect = imgW / imgH;
   const previewH = 0.46;
   const previewW = previewH * aspect;

   const previewEntity = document.getElementById('reference-preview');
   const previewGeom = new THREE.PlaneGeometry(previewW, previewH);
   const previewTexture = new THREE.CanvasTexture(artCanvas);
   if (THREE.SRGBColorSpace) previewTexture.colorSpace = THREE.SRGBColorSpace;
   const previewMat = new THREE.MeshBasicMaterial({map: previewTexture, side: THREE.DoubleSide});
   const previewMesh = new THREE.Mesh(previewGeom, previewMat);
   previewEntity.setObject3D('mesh', previewMesh);

   const slices = sliceCanvasToJigsaw(artCanvas, window.state.gridRows, window.state.gridCols);

   const container = document.getElementById('pieces-container');
   container.innerHTML = '';
   window.state.pieces = [];

   const unitW = window.state.puzzleW / window.state.gridCols;
   const unitH = window.state.puzzleH / window.state.gridRows;
   const pieceMeshW = unitW * 1.56;
   const pieceMeshH = unitH * 1.56;

   slices.forEach((slice, idx) => {
    let randomX = TABLE_MIN_X + 0.1 + Math.random() * (TABLE_MAX_X - TABLE_MIN_X - 0.2);
    let randomZ = TABLE_MIN_Z + 0.1 + Math.random() * (TABLE_MAX_Z - TABLE_MIN_Z - 0.2);
    const restingY = RESTING_Y_BASE + (idx * 0.0001);
    const initialRot = Math.floor(Math.random() * 36) * 10;

    const pieceData = {
     id: idx,
     row: slice.row,
     col: slice.col,
     rotation: initialRot,
     currentPos: {x: randomX, y: restingY, z: randomZ},
     group: []
    };
    pieceData.group = [pieceData];

    window.state.pieces.push(pieceData);

    const pieceEntity = document.createElement('a-entity');
    pieceEntity.setAttribute('id', `piece-${idx}`);
    pieceEntity.setAttribute('class', 'pickable');
    pieceEntity.setAttribute('position', `${pieceData.currentPos.x} ${pieceData.currentPos.y} ${pieceData.currentPos.z}`);
    pieceEntity.setAttribute('rotation', `-90 ${initialRot} 0`);

    const pieceGeom = new THREE.PlaneGeometry(pieceMeshW, pieceMeshH);
    const pieceTexture = new THREE.CanvasTexture(slice.canvas);
    if (THREE.SRGBColorSpace) pieceTexture.colorSpace = THREE.SRGBColorSpace;
    const pieceMat = new THREE.MeshBasicMaterial({
     map: pieceTexture,
     transparent: true,
     alphaTest: 0.1,
     side: THREE.DoubleSide
    });
    const pieceMesh = new THREE.Mesh(pieceGeom, pieceMat);
    pieceMesh.renderOrder = idx;
    pieceEntity.setObject3D('mesh', pieceMesh);

    pieceEntity.addEventListener('mousedown', (e) => {
     if (e.target.closest && e.target.closest('#ui-overlay')) return;
     pickPiece(idx);
    });

    pieceEntity.addEventListener('click', (e) => {
     if (window.state.heldPieceId === null) {
      pickPiece(idx);
     } else if (window.state.heldPieceId === idx) {
      releasePiece(idx);
     }
    });

    container.appendChild(pieceEntity);
   });

   updateUI();
  }

  function getLargestGroupSize() {
   if (!window.state.pieces || window.state.pieces.length === 0) return 0;
   let max = 0;
   window.state.pieces.forEach(p => {
    if (p.group && p.group.length > max) max = p.group.length;
   });
   return max;
  }

  function updateUI() {
   const largestGroup = getLargestGroupSize();
   window.state.isCompleted = (largestGroup >= window.state.totalPieces && window.state.totalPieces > 0);

   const vrHud = document.getElementById('vr-hud-text');
   if (vrHud) {
    if (window.state.isCompleted) {
     vrHud.setAttribute('value', 'Completed!');
     vrHud.setAttribute('color', '#4ade80');
    } else {
     vrHud.setAttribute('value', '');
    }
   }
  }

  function setupApp() {
   const scene = document.querySelector('a-scene');
   if (scene && scene.hasLoaded) loadPuzzleImage();
   else if (scene) scene.addEventListener('loaded', loadPuzzleImage);
   else window.addEventListener('DOMContentLoaded', loadPuzzleImage);

   ['left-hand', 'right-hand'].forEach(handId => {
    const handEl = document.getElementById(handId);
    if (!handEl) return;

    const isLeft = handId === 'left-hand';

    const handlePick = () => {
     if (isLeft) window.state.leftPinching = true;
     else window.state.rightPinching = true;

     const rc = handEl.components.raycaster;
     if (rc && rc.intersections && rc.intersections.length > 0) {
      const hit = rc.intersections[0].object.el;
      if (hit && hit.classList.contains('pickable')) {
       const id = parseInt(hit.id.replace('piece-', ''), 10);
       if (!isNaN(id) && window.state.heldPieceId === null) {
        pickPiece(id, handEl);
       }
      }
     }
    };

    const handleRelease = () => {
     if (isLeft) window.state.leftPinching = false;
     else window.state.rightPinching = false;

     if (window.state.heldPieceId !== null && window.state.activeVRHand === handEl) {
      releasePiece(window.state.heldPieceId);
     }
    };

    handEl.addEventListener('selectstart', handlePick);
    handEl.addEventListener('pinchstarted', handlePick);

    handEl.addEventListener('selectend', handleRelease);
    handEl.addEventListener('pinchend', handleRelease);

    ['abuttondown', 'xbuttondown', 'thumbstickdown'].forEach(btnEvent => {
     handEl.addEventListener(btnEvent, () => {
      if (window.state.heldPieceId !== null) rotateHeldGroup(10);
     });
    });

    ['bbuttondown', 'ybuttondown'].forEach(btnEvent => {
     handEl.addEventListener(btnEvent, () => {
      if (window.state.heldPieceId !== null) rotateHeldGroup(-10);
     });
    });
   });
  }

  if (document.readyState === 'loading') {
   window.addEventListener('DOMContentLoaded', setupApp);
  } else {
   setupApp();
  }
 </script>
</body>
